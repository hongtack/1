<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI가 찾아주는 나의 힐링 향</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#e9eee8;color:#25332d}.app{min-height:100vh;background:light-dark(#f7f4ee,#202722);padding:28px 18px 40px}.wrap{max-width:560px;margin:auto}.hero{padding:18px 4px 22px}.eyebrow{font-size:13px;letter-spacing:.08em;color:#71857a;font-weight:700}.hero h1{font-size:30px;line-height:1.25;margin:8px 0}.hero p{margin:0;color:#66746d;line-height:1.6}.card{background:light-dark(#fffdf9,#29322d);border:1px solid light-dark(#e6e0d6,#3c4740);border-radius:24px;padding:24px;box-shadow:0 12px 30px rgba(42,55,48,.08)}.progress{height:7px;background:light-dark(#ebe7df,#3a433e);border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:#8da99a;transition:width .25s}.qnum{font-size:13px;color:#7b8b84;font-weight:700}.question{font-size:22px;line-height:1.4;margin:8px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;padding:15px 16px;border-radius:16px;border:1px solid light-dark(#dedbd3,#465149);background:light-dark(#faf9f5,#252d29);text-align:left;color:inherit;font-size:15px;cursor:pointer;transition:.15s}.choice:hover,.choice:focus{transform:translateY(-1px);border-color:#8da99a;outline:none}.choice.selected{border-color:#7d9c8d;background:#edf4ef}.result{text-align:center}.result .emoji{font-size:64px}.result h2{font-size:30px;margin:8px 0}.tag{display:inline-block;padding:7px 12px;border-radius:99px;background:#e8f0eb;color:#587266;font-size:13px;font-weight:700}.desc{font-size:16px;line-height:1.7;color:#64726b}.note{margin:18px 0;padding:16px;border-radius:16px;background:light-dark(#f3efe7,#333b36);text-align:left;line-height:1.65;font-size:14px}.actions{display:flex;gap:10px;margin-top:20px}.btn{flex:1;border:0;border-radius:15px;padding:14px;font-weight:700;cursor:pointer}.primary{background:#789789;color:white}.secondary{background:light-dark(#eae7df,#3a443e);color:inherit}.footer{text-align:center;font-size:12px;color:#8a968f;margin-top:18px}.hidden{display:none}</style>
</head>
<body>
<div class="app"><main class="wrap">
<section class="hero"><div class="eyebrow">TEACHER HEALING PROGRAM</div><h1>🌿 AI가 찾아주는<br>나의 힐링 향</h1><p>지금의 나에게 가장 필요한 향은 무엇일까요?<br>6개의 질문에 답하면 나에게 어울리는 디퓨저 향을 추천해드려요.</p></section>
<section class="card" id="quiz"></section>
<div class="footer">이 테스트는 이름·연락처를 수집하지 않습니다.</div>
</main></div>
<script>
const scents={lavender:{name:'라벤더',emoji:'💜',tag:'휴식과 마음의 안정',desc:'잠시 멈추고 깊게 쉬어가고 싶은 당신에게 잘 어울리는 향이에요. 은은한 허브 느낌이 편안한 분위기를 만들어줍니다.'},whiteTea:{name:'화이트티',emoji:'🤍',tag:'깨끗하고 편안한 여유',desc:'복잡한 마음을 가볍게 정리하고 싶은 당신에게 추천해요. 깨끗하고 은은한 향이라 교사 힐링 프로그램에서도 부담 없이 즐기기 좋습니다.'},forest:{name:'포레스트',emoji:'🌲',tag:'자연 속에서 쉬는 듯한 편안함',desc:'자연과 함께할 때 마음이 편안해지는 타입이에요. 나무와 숲을 떠올리게 하는 차분한 향이 잘 어울립니다.'},bergamot:{name:'베르가못',emoji:'🍋',tag:'상쾌한 기분전환',desc:'답답한 기분을 털어내고 산뜻하게 리셋하고 싶은 당신에게 잘 어울려요. 밝고 깨끗한 시트러스 계열입니다.'},freesia:{name:'프리지아',emoji:'🌸',tag:'따뜻하고 산뜻한 위로',desc:'부드러운 꽃향처럼 따뜻한 위로와 기분 좋은 설렘을 원하는 당신에게 추천해요.'},musk:{name:'화이트머스크',emoji:'🤍',tag:'포근하고 부드러운 휴식',desc:'포근하고 은은한 향으로 나만의 안전한 공간을 만들고 싶은 당신에게 잘 어울립니다.'}};
const qs=[
['지금 나에게 가장 필요한 것은?', [['깊은 휴식','lavender'],['가볍게 기분 전환','bergamot'],['자연 속에서 쉬는 느낌','forest'],['따뜻한 위로','freesia'],['깨끗하고 맑은 느낌','whiteTea'],['포근한 안정','musk']]],
['가장 끌리는 공간은 어디인가요?', [['조용한 침실','lavender'],['햇살 좋은 카페','whiteTea'],['초록이 가득한 숲','forest'],['꽃이 피어 있는 정원','freesia'],['상쾌한 바닷가','bergamot'],['포근한 호텔 라운지','musk']]],
['평소 가장 좋아하는 향은?', [['허브·라벤더','lavender'],['차·비누처럼 깨끗한 향','whiteTea'],['나무·흙·숲 향','forest'],['은은한 꽃향','freesia'],['레몬·시트러스 향','bergamot'],['깨끗하고 포근한 머스크','musk']]],
['디퓨저에서 원하는 느낌은?', [['은은하고 조용한','lavender'],['깨끗하고 산뜻한','whiteTea'],['자연스럽고 편안한','forest'],['화사하고 부드러운','freesia'],['시원하고 상쾌한','bergamot'],['고급스럽고 포근한','musk']]],
['하루 중 가장 쉬고 싶은 순간은?', [['잠들기 전','lavender'],['혼자 차를 마실 때','whiteTea'],['공원이나 숲을 산책한 뒤','forest'],['주말 오후','freesia'],['퇴근 직후','bergamot'],['나만의 공간에 들어왔을 때','musk']]],
['나를 위한 힐링을 한 문장으로 고른다면?', [['“아무것도 하지 않아도 괜찮아.”','lavender'],['“마음도 가볍게 리셋하자.”','bergamot'],['“자연처럼 천천히 쉬어가자.”','forest'],['“오늘의 나를 다독여주자.”','freesia'],['“깨끗하게 비우고 다시 시작하자.”','whiteTea'],['“나만의 포근한 공간을 만들자.”','musk']]]
];
let step=0, scores={lavender:0,whiteTea:0,forest:0,bergamot:0,freesia:0,musk:0};
function render(){const el=document.getElementById('quiz'); if(step>=qs.length){showResult(el);return;} const [q,opts]=qs[step]; el.innerHTML=`<div class="progress"><div class="bar" style="width:${(step/qs.length)*100}%"></div></div><div class="qnum">QUESTION ${step+1} / ${qs.length}</div><div class="question">${q}</div><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${String.fromCharCode(65+i)}. ${o[0]}</button>`).join('')}</div>`; el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];scores[o[1]]++;step++;render();});}
function showResult(el){const winner=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];const s=scents[winner];el.innerHTML=`<div class="result"><div class="emoji">${s.emoji}</div><div class="tag">당신의 힐링 향</div><h2>${s.name}</h2><p class="desc"><strong>${s.tag}</strong><br>${s.desc}</p><div class="note"><strong>🌿 디퓨저 만들기 TIP</strong><br>오늘은 ${s.name} 향으로 나만의 힐링 공간을 만들어보세요. 향을 맡을 때마다 “잠시 쉬어가도 괜찮아”라는 시간을 선물해보세요.</div><div class="actions"><button class="btn secondary" onclick="resetQuiz()">다시 테스트</button><button class="btn primary" onclick="copyResult('${s.name}')">결과 저장</button></div></div>`;}
function resetQuiz(){step=0;scores={lavender:0,whiteTea:0,forest:0,bergamot:0,freesia:0,musk:0};render();}
function copyResult(name){navigator.clipboard?.writeText('나의 힐링 향: '+name).then(()=>alert('“나의 힐링 향: '+name+'” 결과가 복사되었어요.'));}
render();
</script></body></html>
